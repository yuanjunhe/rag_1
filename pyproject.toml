[project]
name = "rag-1"
version = "0.1.0"
description = "简易 RAG 知识库问答系统"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.0",
    "openai>=3.8.0",
    "sentence-transformers>=6.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_1"]
